[project]
name = "morph-robot-lerobot"
version = "0.1.0"
description = "Official LeRobot setup and SO-101 connection checks for Morph"
authors = [
    { name = "winsortf", email = "winsortf@gmail.com" }
]
requires-python = ">=3.12,<3.14"
dependencies = [
    "lerobot[feetech,hardware]==0.7.0",
    "torch>=2.7,<2.16",
    "torchvision>=0.22,<0.30",
]

[tool.uv]
cache-dir = ".runtime/uv-cache"

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]
torchvision = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[project.scripts]
morph-robot-lerobot = "morph_robot_lerobot:main"

[build-system]
requires = ["uv_build>=0.13.8,<0.14.0"]
build-backend = "uv_build"
