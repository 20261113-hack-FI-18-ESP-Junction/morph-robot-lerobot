[project]
name = "morph-robot-lerobot"
version = "0.1.0"
description = "Official LeRobot setup and SO-101 connection checks for Morph"
readme = "README.md"
authors = [
    { name = "winsortf", email = "winsortf@gmail.com" }
]
requires-python = ">=3.12,<3.14"
dependencies = [
    "lerobot[feetech,hardware]==0.7.0",
]

[project.scripts]
morph-robot-lerobot = "morph_robot_lerobot:main"

[build-system]
requires = ["uv_build>=0.13.8,<0.14.0"]
build-backend = "uv_build"
